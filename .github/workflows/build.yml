name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_MINOR: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -jq templates.tpz 'templates/version.txt' 'templates/windows_*x86_64*' -d "$templates"
          rm godot.zip templates.tpz

      - name: Set up Godot
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . --script res://tests/run_tests.gd 2>&1 | tee test.log
      - name: Report test failures
        if: failure()
        run: |
          # Surface failures as annotations, readable without downloading logs.
          grep -E "FAIL|check failed|SCRIPT ERROR|ERROR" test.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/choppa.exe
          test -f build/windows/choppa.exe

      - uses: actions/upload-artifact@v7
        with:
          name: choppa-windows
          path: build/windows/choppa.exe

