name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_MINOR: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -jq templates.tpz 'templates/version.txt' 'templates/windows_*x86_64*' \
            'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' \
            -d "$templates"
          rm godot.zip templates.tpz

      - name: Set up Godot
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows" build/windows/choppa.exe
          test -f build/windows/choppa.exe

      # Android only installs an update over an older APK if both are signed with the same
      # key, so use a stable key from repository secrets when one is configured.
      - name: Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/choppa.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: signing with a throwaway key. Uninstall the previous APK before installing this one."
            password=android
            keytool -genkeypair -keystore "$keystore" -storepass "$password" -keypass "$password" \
              -alias choppa -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=choppa"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=choppa"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Export Android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/choppa.apk
          test -f build/android/choppa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: choppa-windows
          path: build/windows/choppa.exe

      - uses: actions/upload-artifact@v4
        with:
          name: choppa-android
          path: build/android/choppa.apk
